<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evil Meter</title>
<style>
  :root {
    --bg: #0c0a0f;
    --panel: #16121b;
    --line: #2a2231;
    --text: #efe9f3;
    --muted: #9a8fa3;
    --good: #3ddc84;
    --warn: #ffb020;
    --evil: #ff2e4d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #2a0d17 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px 28px;
    overflow-x: hidden;
  }
  header { font-weight: 800; letter-spacing: .32em; font-size: 13px; color: var(--muted); text-transform: uppercase; }
  header b { color: var(--evil); }
  .gauge { width: min(440px, 100%); margin-top: 6px; position: relative; }
  svg { width: 100%; display: block; overflow: visible; }
  .readout { position: absolute; left: 0; right: 0; top: 74%; text-align: center; pointer-events: none; }
  .num { font-size: 58px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .unit { font-size: 12px; letter-spacing: .25em; color: var(--muted); text-transform: uppercase; margin-top: 6px; }
  .status { margin-top: 2px; font-size: 15px; color: var(--muted); letter-spacing: .08em; min-height: 22px; text-align: center; }
  .measuring .status { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  .verdict { margin-top: 14px; text-align: center; opacity: 0; transform: translateY(8px); transition: all .5s ease .9s; max-width: 520px; }
  .done .verdict { opacity: 1; transform: none; }
  .title { font-size: 26px; font-weight: 800; }
  .roast { color: var(--muted); margin-top: 6px; line-height: 1.45; font-style: italic; }
  .stamp {
    display: inline-block; margin-top: 16px; padding: 8px 18px; border: 3px solid currentColor; border-radius: 8px;
    font-weight: 900; letter-spacing: .18em; font-size: 18px; transform: rotate(-4deg) scale(1.6); opacity: 0;
    transition: transform .35s cubic-bezier(.2,1.6,.4,1) 1.3s, opacity .2s ease 1.3s;
  }
  .done .stamp { transform: rotate(-4deg) scale(1); opacity: 1; }
  .stamp.allowed { color: var(--good); }
  .stamp.blocked { color: var(--evil); box-shadow: 0 0 24px #ff2e4d55; }

  .card { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-top: 18px; opacity: 0; transition: opacity .5s ease 1.6s; }
  .done .card, .card.always { opacity: 1; }
  .card h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .sin { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .sin:first-of-type { border-top: 0; }
  .pts { color: var(--evil); font-weight: 800; font-variant-numeric: tabular-nums; min-width: 38px; }
  .where { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); word-break: break-all; }
  .commit { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); padding: 2px 0; word-break: break-word; }
  .commit span { color: var(--warn); }
  .error { color: var(--warn); }
  .foot { margin-top: 18px; font-size: 12px; color: var(--muted); }
  button { background: none; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; cursor: pointer; font: inherit; }
  button:hover { color: var(--text); border-color: var(--muted); }
</style>
</head>
<body class="measuring">
  <header>☠ <b>Evil</b> Meter</header>

  <div class="gauge">
    <svg id="svg" viewBox="0 0 400 300" aria-label="Evil gauge">
      <defs>
        <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="50" y1="0" x2="350" y2="0">
          <stop offset="0" stop-color="#3ddc84"/>
          <stop offset=".45" stop-color="#ffb020"/>
          <stop offset=".75" stop-color="#ff5a2e"/>
          <stop offset="1" stop-color="#ff2e4d"/>
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path id="track" fill="none" stroke="#2a2231" stroke-width="18" stroke-linecap="round"/>
      <path id="fill" fill="none" stroke="url(#grad)" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>
      <g id="ticks"></g>
      <g id="limit"></g>
      <g id="needle">
        <polygon points="0,-5 140,0 0,5" fill="#efe9f3"/>
        <circle r="10" fill="#efe9f3"/>
        <circle r="4" fill="#0c0a0f"/>
      </g>
    </svg>
    <div class="readout">
      <div class="num" id="num">0</div>
      <div class="unit">evil / 100</div>
    </div>
  </div>

  <div class="status" id="status">Measuring evil…</div>

  <div class="verdict">
    <div class="title" id="title"></div>
    <div class="roast" id="roast"></div>
    <div class="stamp" id="stamp"></div>
  </div>

  <div class="card" id="sinsCard" hidden><h3>Sins detected</h3><div id="sins"></div></div>
  <div class="card always" id="commitsCard" hidden><h3>Being pushed</h3><div id="commits"></div></div>

  <div class="foot"><button id="close">Close</button></div>

<script>
  const CX = 200, CY = 195, R = 150;
  const angleFor = v => (150 + v * 2.4) * Math.PI / 180;     // 240° sweep, 0 at lower-left
  const pt = (v, r = R) => [CX + r * Math.cos(angleFor(v)), CY + r * Math.sin(angleFor(v))];
  const arc = (a, b) => {
    const [x1, y1] = pt(a), [x2, y2] = pt(b);
    return `M ${x1} ${y1} A ${R} ${R} 0 ${(b - a) * 2.4 > 180 ? 1 : 0} 1 ${x2} ${y2}`;
  };
  const $ = id => document.getElementById(id);
  const svgNS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(svgNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    parent.appendChild(n);
    return n;
  };

  $("track").setAttribute("d", arc(0, 100));
  for (let v = 0; v <= 100; v += 5) {
    const major = v % 10 === 0;
    const [x1, y1] = pt(v, R - 16), [x2, y2] = pt(v, R - (major ? 30 : 23));
    el("line", { x1, y1, x2, y2, stroke: major ? "#6d6176" : "#3a3141", "stroke-width": major ? 2.5 : 1.5 }, $("ticks"));
    if (major) {
      const [tx, ty] = pt(v, R - 46);
      const t = el("text", { x: tx, y: ty + 4, "text-anchor": "middle", fill: "#6d6176", "font-size": 12, "font-weight": 700 }, $("ticks"));
      t.textContent = v;
    }
  }

  function drawLimit(threshold) {
    const g = $("limit");
    g.innerHTML = "";
    const [x1, y1] = pt(threshold, R + 14), [x2, y2] = pt(threshold, R - 14);
    el("line", { x1, y1, x2, y2, stroke: "#ff2e4d", "stroke-width": 4, "stroke-linecap": "round" }, g);
    const [tx, ty] = pt(threshold, R + 36);
    const t = el("text", { x: tx, y: ty + 4, "text-anchor": "middle", fill: "#ff2e4d", "font-size": 11, "font-weight": 800, "letter-spacing": ".1em" }, g);
    t.textContent = "LIMIT " + threshold;
  }

  // Needle physics: chase `target`; while measuring, target wanders like a speed test.
  let value = 0, velocity = 0, target = 0, phase = "measuring", wanderT = 0;
  function frame(ts) {
    if (phase === "measuring") {
      wanderT += 0.016;
      target = 45 + 30 * Math.sin(wanderT * 1.7) * Math.sin(wanderT * 0.63 + 1) + (Math.random() - .5) * 10;
    }
    const k = phase === "measuring" ? 0.04 : 0.025, damp = phase === "measuring" ? 0.8 : 0.86;
    velocity = (velocity + (target - value) * k) * damp;
    value = Math.max(0, Math.min(100, value + velocity));
    $("needle").setAttribute("transform", `translate(${CX} ${CY}) rotate(${150 + value * 2.4})`);
    $("fill").setAttribute("d", value < 0.5 ? "" : arc(0, value));
    $("num").textContent = Math.round(value);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function escape(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  function render(state) {
    drawLimit(state.threshold);
    if (state.commits?.length) {
      $("commitsCard").hidden = false;
      $("commits").innerHTML = state.commits.map(c => `<div class="commit"><span>${escape(c.sha)}</span> ${escape(c.subject)}</div>`).join("");
    }
    if (state.phase === "done") {
      const r = state.result;
      phase = "done";
      target = r.score;
      document.body.className = "done";
      const color = r.score > state.threshold ? "var(--evil)" : r.score > state.threshold * 0.6 ? "var(--warn)" : "var(--good)";
      $("num").style.color = color;
      $("status").textContent = state.allowed ? "Within acceptable levels of evil" : "EVIL THRESHOLD EXCEEDED";
      $("status").style.color = color;
      $("title").textContent = r.title;
      $("roast").textContent = r.roast;
      $("stamp").textContent = state.allowed ? "PUSH ALLOWED" : "PUSH BLOCKED";
      $("stamp").className = "stamp " + (state.allowed ? "allowed" : "blocked");
      if (r.sins.length) {
        $("sinsCard").hidden = false;
        $("sins").innerHTML = r.sins.map(s => `<div class="sin"><div class="pts">+${s.points}</div><div><div>${escape(s.description)}</div><div class="where">${escape(s.where)}</div></div></div>`).join("");
      }
      fetch("/ack", { method: "POST" }).catch(() => {});
      return true;
    }
    if (state.phase === "error") {
      phase = "done";
      target = 0;
      document.body.className = "done";
      $("status").innerHTML = `<span class="error">The meter broke: ${escape(state.error)}</span>`;
      $("stamp").textContent = state.allowed ? "PUSH ALLOWED" : "PUSH BLOCKED";
      $("stamp").className = "stamp " + (state.allowed ? "allowed" : "blocked");
      fetch("/ack", { method: "POST" }).catch(() => {});
      return true;
    }
    return false;
  }

  async function poll() {
    try {
      const state = await (await fetch("/state", { cache: "no-store" })).json();
      if (render(state)) return;
    } catch {
      $("status").textContent = "Meter disconnected";
      return;
    }
    setTimeout(poll, 350);
  }
  poll();

  $("close").onclick = () => window.close();
</script>
</body>
</html>
